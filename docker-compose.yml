services:
  portfolio-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  portfolio-api:
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/recaptcha-auth.json
    env_file:
      - ${APP_ENV_FILE}
    expose:
      - "3333"
    volumes:
      - ${PORTFOLIO_DATA_DIR:-/opt/portfolio}/uploads:/usr/src/app/uploads
      - ${RECAPTCHA_CREDENTIALS_FILE:-/opt/portfolio/google/recaptcha-auth.json}:/run/secrets/recaptcha-auth.json:ro
    depends_on:
      portfolio-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - reverse-proxy

  portfolio-web:
    build:
      context: ./web
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL obrigatoria}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:?NEXT_PUBLIC_RECAPTCHA_SITE_KEY obrigatoria}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatoria}
    restart: unless-stopped
    init: true
    env_file:
      - ${APP_ENV_FILE}
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://portfolio-api:3333
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL obrigatoria}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:?NEXT_PUBLIC_RECAPTCHA_SITE_KEY obrigatoria}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL obrigatoria}
    expose:
      - "3000"
    depends_on:
      portfolio-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - reverse-proxy

volumes:
  postgres_prod_data:

networks:
  internal:
    driver: bridge
    internal: true
  reverse-proxy:
    external: true
    name: ${REVERSE_PROXY_NETWORK:-reverse-proxy}
